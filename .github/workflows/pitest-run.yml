name: Mutation Testing

on:
  pull_request:
    branches: [ 'main', '3.x' ]

permissions: {}

env:
  MAVEN_ARGS: -B -V -ntp -e -Djansi.passthrough=true -Dstyle.color=always

jobs:

  run:

    name: Run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'maven'
      - name: Run Mutation Testing
        run: >
          ./mvnw $MAVEN_ARGS -am test-compile pitest:mutationCoverage
          -pl assertj-tests/assertj-integration-tests/assertj-core-tests,assertj-tests/assertj-integration-tests/assertj-guava-tests
          -DextraFeatures="+GIT(from[HEAD~1]), +gitci"
      - name: Aggregate Results
        run: ./mvnw $MAVEN_ARGS pitest-git:aggregate
      - name: Upload Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pitest
          path: target/pit-reports-ci/
